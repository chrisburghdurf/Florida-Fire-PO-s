<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PO Viewer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a1119;
        color: #f2f5fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 10px 12px;
        background: rgba(10, 17, 25, 0.95);
        border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      }
      .meta {
        font-size: 12px;
        color: #b9c8dc;
      }
      #status {
        font-size: 13px;
      }
      #pages {
        padding: 10px 8px 18px;
      }
      .page-wrap {
        margin: 0 auto 12px;
        width: fit-content;
        max-width: 100%;
        background: #111827;
        border: 1px solid rgba(148, 163, 184, 0.24);
      }
      .page-label {
        font-size: 11px;
        color: #a9bad0;
        padding: 4px 8px;
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  </head>
  <body>
    <div class="topbar">
      <div id="status">Loading PDF...</div>
      <div id="meta" class="meta"></div>
    </div>
    <div id="pages"></div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const file = params.get("file") || "/fire-academy-pos.pdf";
        const targetPage = Math.max(1, parseInt(params.get("page") || "1", 10));
        const statusEl = document.getElementById("status");
        const metaEl = document.getElementById("meta");
        const pagesEl = document.getElementById("pages");

        if (!window.pdfjsLib) {
          statusEl.textContent = "Unable to load PDF engine.";
          return;
        }

        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        function fitScale(viewportWidth) {
          const available = Math.max(320, window.innerWidth - 16);
          return available / viewportWidth;
        }

        async function renderAll(pdf) {
          statusEl.textContent = "Rendering pages...";
          metaEl.textContent = "Target page " + targetPage;

          let targetNode = null;

          for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
            const page = await pdf.getPage(pageNumber);
            const base = page.getViewport({ scale: 1 });
            const viewport = page.getViewport({ scale: fitScale(base.width) });

            const wrap = document.createElement("div");
            wrap.className = "page-wrap";
            wrap.id = "page-" + pageNumber;

            const label = document.createElement("div");
            label.className = "page-label";
            label.textContent = "Page " + pageNumber;

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);

            wrap.appendChild(label);
            wrap.appendChild(canvas);
            pagesEl.appendChild(wrap);

            await page.render({ canvasContext: context, viewport: viewport }).promise;

            if (pageNumber === targetPage) {
              targetNode = wrap;
            }
          }

          statusEl.textContent = "Loaded";
          metaEl.textContent = "File: " + file;

          if (targetNode) {
            targetNode.scrollIntoView({ block: "start", behavior: "auto" });
          }
        }

        pdfjsLib
          .getDocument({ url: file })
          .promise.then((pdf) => {
            statusEl.textContent = "Loaded " + pdf.numPages + " pages";
            return renderAll(pdf);
          })
          .catch((error) => {
            statusEl.textContent = "Failed to load PDF";
            metaEl.textContent = String(error && error.message ? error.message : error);
          });
      })();
    </script>
  </body>
</html>
